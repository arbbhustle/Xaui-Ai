name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "XAU_AI_Trader_Android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XAU_AI_Trader_Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "ERROR: GitHub Actions secret GOOGLE_SERVICES_JSON_B64 is missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build current DardaniaXAUTRADE APK
        run: gradle assembleDebug --stacktrace

      - name: Upload current APK
        uses: actions/upload-artifact@v4
        with:
          name: DardaniaXAUTRADE-v3-debug
          path: XAU_AI_Trader_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
